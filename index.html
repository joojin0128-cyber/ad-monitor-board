<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>광고 모니터</title>
<style>
:root{--bg:#15171d;--s:#1a1c23;--s2:#22252e;--s3:#2a2e38;--line:#2a2e38;--t:#e7e9ef;--m:#8a93a8;--f:#5e6678;--g:#4ade80;--gf:#22c55e;--y:#facc15;--yf:#eab308;--r:#f87171;--rf:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}body{background:var(--bg);color:var(--t);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;font-feature-settings:"tnum"}
main{max-width:520px;margin:0 auto;padding:10px;display:grid;gap:7px}.g{color:var(--g)}.y{color:var(--y)}.r{color:var(--r)}.n,.muted{color:var(--m)}
.upd{display:grid;gap:2px;padding:8px 2px}.op{display:grid;gap:2px;background:#2f5ef022;border-color:#2f5ef077}.op b{font-size:15px}.op span{font-size:12px;color:var(--m)}.upd b{font-size:20px}.upd span{font-size:12px;color:var(--m)}
.stale{background:#3b2a12;color:#fdba74;border-radius:8px;padding:7px 10px;font-size:13px}
section,.on,.none{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;overflow:hidden}
.row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.roas{font-size:34px;font-weight:800;line-height:1}.vs{font-size:13px;color:var(--m)}.vs b{color:var(--t)}
.gauge{position:relative;height:8px;border-radius:4px;margin:14px 0 12px;background:linear-gradient(90deg,#ef444488 0 var(--be),#eab30888 var(--be) var(--goal),#22c55e88 var(--goal) 100%)}
.me{position:absolute;top:-5px;width:18px;height:18px;margin-left:-9px;border-radius:50%;border:3px solid var(--s);background:var(--m)}.me.g{background:var(--gf)}.me.y{background:var(--yf)}.me.r{background:var(--rf)}
.facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--m)}.facts b{color:var(--t)}.facts b.g{color:var(--g)}.facts b.r{color:var(--r)}
.hyoja{display:grid;grid-template-columns:1fr auto;gap:2px 8px;background:linear-gradient(135deg,#22c55e33,var(--s) 70%);border-color:#22c55e77}.hyoja .r3{grid-row:1/span 2;grid-column:2;font-size:22px;font-weight:800;color:var(--g)}
.hyoja .l{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.none{font-size:13px;color:var(--m);border-style:dashed}
h4{font-size:12px;color:var(--m);margin-bottom:5px}.todo ol{padding-left:18px;display:grid;gap:3px;font-size:13.5px}.todo.old{opacity:.6}
summary{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}details p{font-size:12px;color:var(--m);margin:2px 0 4px}
.on{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--m)}.on b{color:var(--g)}.on.bad b{color:var(--r)}
.dots{display:flex;gap:6px}.dots i{display:block;flex:none;width:9px;height:9px;border-radius:50%;background:var(--gf)}.dots i.d-off{background:var(--rf)}.dots i.d-unk{background:var(--f)}
.slots{display:grid;gap:5px}.slot.t-g{background:#22c55e26;border-left:6px solid var(--gf)}.slot.t-y{background:#eab30826;border-left:6px solid var(--yf)}.slot.t-r{background:#ef444426;border-left:6px solid var(--rf)}.slot.soft.t-g{background:#22c55e12;border-left-color:#22c55e88}.slot.soft.t-y{background:#eab30812;border-left-color:#eab30888}.slot.soft.t-r{background:#ef444412;border-left-color:#ef444488}.slot.t-n{border-left:6px solid #5e667888}.tent{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;color:var(--m);border:1px dashed var(--f);font-style:normal}.slot{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:9px;align-items:center;background:var(--s);border:1px solid var(--line);border-radius:10px;padding:5px 10px 5px 6px;min-height:46px}
.chip{height:34px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:800;background:var(--s3);color:var(--m)}.chip.g{background:var(--gf);color:#0d0f13}.chip.y{background:var(--yf);color:#0d0f13}.chip.r{background:var(--rf);color:#fff}
.m{display:grid;gap:3px;min-width:0}.say{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.say em{font-style:normal;font-size:10.5px;padding:1px 5px;border-radius:4px}
.up{color:var(--g);background:#22c55e22}.down{color:var(--m);background:#94a3b822}.down.due{color:#f87171;background:#ef444422}.star{color:#fde68a;background:#eab30822}.sub{font-size:11px;color:var(--m);display:flex;gap:6px;align-items:center}
.bar{width:70px;height:4px;border-radius:2px;background:var(--s3);overflow:hidden}.bar i{display:block;height:100%;background:var(--m)}
.rr{text-align:right;line-height:1.05}.rr b{font-size:17px;font-weight:800}.rr small{display:block;font-size:10.5px;color:var(--f)}
.grad table{width:100%;border-collapse:collapse;font-size:12px}.grad th{font-weight:500;color:var(--f);text-align:right;padding:2px}.grad td{text-align:right;padding:3px 2px;border-top:1px solid var(--line)}.grad td:first-child,.grad th:first-child{text-align:left;color:var(--m)}
.grad h4 span{float:right;font-weight:500}.grad .fee{margin-top:6px;font-size:12px;color:var(--gf);font-weight:700}.grad ul{list-style:none;margin-top:8px;font-size:12px;display:grid;gap:3px}.grad li::before{content:"● ";color:var(--f)}.grad li.ok::before{color:var(--gf)}
.legend{font-size:11px;color:var(--m);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:4px 2px 16px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px}.legend i.g{background:var(--gf)}.legend i.y{background:var(--yf)}.legend i.r{background:var(--rf)}.legend i.n{background:var(--s3)}
#gate{max-width:360px;margin:18vh auto 0;padding:20px;display:grid;gap:10px}#gate input{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--s3);background:var(--s);color:var(--t)}
#gate button{font:inherit;font-weight:700;padding:10px;border-radius:10px;border:0;background:#2f5ef0;color:#fff}#gate label{font-size:13px;color:var(--m);display:flex;gap:6px;align-items:center}#err{color:var(--r);font-size:13px;min-height:1em}
</style></head><body>
<form id="gate" autocomplete="off"><b>광고 모니터</b><input id="pw" type="password" inputmode="numeric" placeholder="비밀번호" autocomplete="current-password" required>
<label><input id="keep" type="checkbox"> 이 기기에서 기억</label><button>열기</button><p id="err"></p></form><main id="out" hidden></main>
